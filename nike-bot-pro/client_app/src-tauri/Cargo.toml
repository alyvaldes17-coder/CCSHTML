[package]
name = "nike-bot-commercial"
version = "1.0.0"
description = "Professional Nike bot desktop application"
authors = ["Your Name"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "crash"
codegen-units = 1
lto = true
